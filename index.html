<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计算思维交互式仿真学习平台</title>
<style>
/* ========================================
   全局变量 & 重置
   ======================================== */
:root {
  --primary: #1a73e8;
  --primary-dark: #1557b0;
  --primary-light: #e8f0fe;
  --primary-gradient: linear-gradient(135deg, #1a73e8, #4285f4);
  --bg: #f0f2f5;
  --surface: #ffffff;
  --text: #1f2937;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --border: #e5e7eb;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
  --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.1), 0 4px 6px rgba(0,0,0,.05);
  --shadow-xl: 0 20px 25px rgba(0,0,0,.1), 0 10px 10px rgba(0,0,0,.04);
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --transition: 200ms cubic-bezier(.4,0,.2,1);
  --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;

  /* 模块配色 */
  --m1: #4a90d9;
  --m2: #5b9bd5;
  --m3: #3c7cc6;
  --m4: #6ba3d6;
  --m5: #2e6db5;
  --m6: #7eb5e0;
  --m7: #1a5da6;
  --m8: #4f8ed4;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html,body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  height:100%;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}

/* ========================================
   登录页面
   ======================================== */
.login-page{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#e8f0fe 0%,#d2e3fc 25%,#c4d7f2 50%,#dbeafe 75%,#eff6ff 100%);
  background-size:400% 400%;
  animation:bgShift 20s ease infinite;
  z-index:100;
  transition:opacity .4s,visibility .4s;
}
.login-page.hidden{opacity:0;visibility:hidden;pointer-events:none}

@keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.login-bg-decor{
  position:absolute;inset:0;overflow:hidden;pointer-events:none;
}
.login-bg-decor::before{
  content:'';position:absolute;
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(26,115,232,.08) 0%,transparent 70%);
  top:-200px;right:-100px;border-radius:50%;
}
.login-bg-decor::after{
  content:'';position:absolute;
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(66,133,244,.06) 0%,transparent 70%);
  bottom:-150px;left:-100px;border-radius:50%;
}

.login-bg-pattern{
  position:absolute;inset:0;
  background-image:
    radial-gradient(circle at 20% 30%,rgba(26,115,232,.03) 1px,transparent 1px),
    radial-gradient(circle at 80% 70%,rgba(66,133,244,.04) 1px,transparent 1px);
  background-size:60px 60px,40px 40px;
}

.login-container{
  position:relative;z-index:1;
  width:440px;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-radius:var(--radius-xl);
  padding:48px 40px;
  box-shadow:0 25px 50px rgba(26,115,232,.12),0 0 0 1px rgba(255,255,255,.8) inset;
}

.login-header{text-align:center;margin-bottom:36px}
.login-logo{
  width:64px;height:64px;
  margin:0 auto 16px;
  background:var(--primary-gradient);
  border-radius:18px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(26,115,232,.25);
}
.login-logo svg{width:36px;height:36px}
.login-title{
  font-size:22px;font-weight:700;
  color:var(--text);letter-spacing:-.3px;
}
.login-subtitle{
  font-size:13px;color:var(--text-secondary);
  margin-top:6px;
}

.login-form{display:flex;flex-direction:column;gap:20px}

.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:13px;font-weight:600;color:var(--text-secondary)}
.form-input{
  height:46px;padding:0 16px;
  border:1.5px solid var(--border);
  border-radius:10px;
  font-size:14px;font-family:var(--font);
  color:var(--text);background:#fafbfc;
  transition:var(--transition);
  outline:none;
}
.form-input:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(26,115,232,.12);
  background:#fff;
}
.form-input::placeholder{color:var(--text-muted)}

.form-row{
  display:flex;align-items:center;justify-content:space-between;
}
.remember-me{
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--text-secondary);cursor:pointer;
}
.remember-me input[type=checkbox]{
  width:15px;height:15px;accent-color:var(--primary);cursor:pointer;
}
.forgot-link{font-size:13px;color:var(--primary)}

.btn-login{
  height:48px;
  background:var(--primary-gradient);
  color:#fff;border:none;border-radius:10px;
  font-size:15px;font-weight:600;
  cursor:pointer;
  transition:all var(--transition);
  box-shadow:0 4px 12px rgba(26,115,232,.3);
  position:relative;overflow:hidden;
}
.btn-login:hover{
  transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(26,115,232,.35);
}
.btn-login:active{transform:translateY(0);box-shadow:0 2px 8px rgba(26,115,232,.25)}
.btn-login.loading{pointer-events:none;opacity:.8}

.login-footer{
  text-align:center;margin-top:8px;
  font-size:13px;color:var(--text-secondary);
}

.login-divider{
  display:flex;align-items:center;gap:16px;
  color:var(--text-muted);font-size:12px;
}
.login-divider::before,.login-divider::after{
  content:'';flex:1;height:1px;background:var(--border);
}

/* toast */
.toast{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  padding:12px 24px;border-radius:10px;
  font-size:14px;font-weight:500;color:#fff;
  z-index:9999;opacity:0;transition:opacity .3s,transform .3s;
  pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:#ef4444}
.toast.success{background:#10b981}

/* ========================================
   主平台页面
   ======================================== */
.platform{
  display:none;
  height:100vh;width:100vw;
  grid-template-columns:240px 1fr;
  grid-template-rows:56px 1fr;
  grid-template-areas:
    "header header"
    "sidebar main";
}
.platform.active{display:grid}

/* 顶部导航 */
.header{
  grid-area:header;
  background:linear-gradient(135deg,#1a73e8,#4285f4);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  color:#fff;
  z-index:50;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.header-left{
  display:flex;align-items:center;gap:12px;
}
.header-logo{
  width:32px;height:32px;
  background:rgba(255,255,255,.2);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}
.header-logo svg{width:20px;height:20px}
.header-title{font-size:15px;font-weight:600;letter-spacing:-.2px}
.header-right{display:flex;align-items:center;gap:16px}
.header-icon-btn{
  width:34px;height:34px;
  border-radius:8px;background:rgba(255,255,255,.15);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:var(--transition);
}
.header-icon-btn:hover{background:rgba(255,255,255,.25)}
.header-icon-btn svg{width:18px;height:18px}
.user-avatar{
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.25);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:600;cursor:pointer;
  transition:var(--transition);
}
.user-avatar:hover{background:rgba(255,255,255,.35)}
.user-dropdown{position:relative}
.user-menu{
  position:absolute;top:44px;right:0;
  background:#fff;border-radius:var(--radius);
  box-shadow:var(--shadow-xl);
  min-width:160px;padding:6px;
  display:none;z-index:100;
}
.user-menu.show{display:block}
.user-menu-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 14px;border-radius:8px;
  font-size:13px;color:var(--text);cursor:pointer;
  transition:var(--transition);
}
.user-menu-item:hover{background:var(--primary-light);color:var(--primary)}
.user-menu-item svg{width:16px;height:16px}

/* 侧边栏 */
.sidebar{
  grid-area:sidebar;
  background:#fff;
  border-right:1px solid var(--border);
  overflow-y:auto;
  padding:12px 0;
}
.sidebar-section{padding:0 16px 8px}
.sidebar-section-title{
  font-size:11px;font-weight:700;color:var(--text-muted);
  text-transform:uppercase;letter-spacing:.8px;
  padding:12px 0 8px;
}
.sidebar-menu{list-style:none}
.sidebar-menu li a{
  display:flex;align-items:center;gap:10px;
  padding:9px 16px;border-radius:8px;
  font-size:13.5px;color:var(--text-secondary);
  transition:var(--transition);
  margin:1px 8px;
}
.sidebar-menu li a:hover{background:var(--primary-light);color:var(--primary);text-decoration:none}
.sidebar-menu li a.active{background:var(--primary-light);color:var(--primary);font-weight:600}
.sidebar-menu li a svg{width:18px;height:18px;flex-shrink:0}

/* 主内容区 */
.main{
  grid-area:main;
  overflow-y:auto;
  padding:28px 32px;
}
.main-header{margin-bottom:28px}
.main-title{font-size:24px;font-weight:700;color:var(--text);letter-spacing:-.4px}
.main-desc{font-size:13.5px;color:var(--text-secondary);margin-top:4px}

/* 模块卡片网格 */
.module-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
}
.module-card{
  background:var(--surface);
  border-radius:var(--radius-lg);
  padding:28px 24px;
  cursor:pointer;
  transition:all .25s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--shadow);
  border:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;gap:16px;
  position:relative;overflow:hidden;
}
.module-card::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:3px;
  background:var(--card-color,var(--primary));
  transform:scaleX(0);transition:transform .3s;
}
.module-card:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-xl);
  border-color:transparent;
}
.module-card:hover::before{transform:scaleX(1)}
.module-card:active{transform:translateY(-1px)}

.module-card-icon{
  width:72px;height:72px;
  border-radius:20px;
  display:flex;align-items:center;justify-content:center;
  transition:transform .3s;
}
.module-card:hover .module-card-icon{transform:scale(1.08)}

.module-card-name{
  font-size:15px;font-weight:600;color:var(--text);
  letter-spacing:-.2px;
}
.module-card-desc{
  font-size:12px;color:var(--text-secondary);
  text-align:center;line-height:1.5;
}

/* ========================================
   子学习页面
   ======================================== */
.sub-system{
  display:none;
  position:fixed;inset:0;
  background:var(--bg);
  z-index:60;
  flex-direction:column;
}
.sub-system.active{display:flex}

.sub-header{
  background:linear-gradient(135deg,#1a73e8,#4285f4);
  display:flex;align-items:center;
  padding:0 20px;height:56px;
  color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.sub-back-btn{
  background:rgba(255,255,255,.15);
  border:none;border-radius:8px;
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:var(--transition);
  margin-right:14px;
}
.sub-back-btn:hover{background:rgba(255,255,255,.25)}
.sub-back-btn svg{width:18px;height:18px}
.sub-title{font-size:16px;font-weight:600}

.sub-body{
  flex:1;overflow-y:auto;
  padding:32px;
  max-width:1200px;margin:0 auto;width:100%;
}
.sub-welcome{
  background:#fff;border-radius:var(--radius-lg);
  padding:40px;text-align:center;
  box-shadow:var(--shadow);border:1px solid var(--border);
}
.sub-welcome-icon{
  width:80px;height:80px;border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;
}
.sub-welcome-icon svg{width:44px;height:44px}
.sub-welcome h2{font-size:22px;font-weight:700;margin-bottom:8px}
.sub-welcome p{color:var(--text-secondary);font-size:14px;max-width:500px;margin:0 auto 24px}
.sub-start-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 28px;
  background:var(--primary-gradient);
  color:#fff;border:none;border-radius:10px;
  font-size:14px;font-weight:600;cursor:pointer;
  transition:var(--transition);
  box-shadow:0 4px 12px rgba(26,115,232,.25);
}
.sub-start-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(26,115,232,.3)}

/* 学习内容区域 */
.sub-content{
  display:grid;grid-template-columns:repeat(2,1fr);gap:20px;
  margin-top:24px;
}
.sub-content-card{
  background:#fff;border-radius:var(--radius-lg);
  padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);
}
.sub-content-card h3{font-size:16px;font-weight:600;margin-bottom:12px;color:var(--text)}
.sub-content-card p{font-size:13px;color:var(--text-secondary);line-height:1.7}

/* 模拟器区域 */
.simulator{
  background:#fff;border-radius:var(--radius-lg);
  padding:32px;box-shadow:var(--shadow);border:1px solid var(--border);
  margin-top:24px;
  min-height:300px;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;
}
.simulator-label{font-size:14px;color:var(--text-muted)}

/* ========================================
   响应式
   ======================================== */
@media(max-width:1200px){
  .module-grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:900px){
  .module-grid{grid-template-columns:repeat(2,1fr)}
  .platform{grid-template-columns:1fr;grid-template-areas:"header" "main"}
  .sidebar{display:none}
  .sub-content{grid-template-columns:1fr}
}

@media(max-width:640px){
  .module-grid{grid-template-columns:1fr}
  .main{padding:20px 16px}
  .login-container{width:calc(100% - 32px);padding:32px 24px}
  .sub-body{padding:20px 16px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- ========================================
   Toast 通知
   ======================================== -->
<div class="toast" id="toast"></div>

<!-- ========================================
   登录页面
   ======================================== -->
<div class="login-page" id="loginPage">
  <div class="login-bg-decor"></div>
  <div class="login-bg-pattern"></div>

  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="login-title">计算思维交互式仿真学习平台</div>
      <div class="login-subtitle">Computational Thinking Interactive Simulation Platform</div>
    </div>

    <form class="login-form" id="loginForm" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="username">用户名 / 邮箱</label>
        <input class="form-input" type="text" id="username" placeholder="请输入用户名或邮箱" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">密码</label>
        <input class="form-input" type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
      </div>

      <div class="form-row">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe">
          <span>记住登录状态</span>
        </label>
        <a class="forgot-link" href="#" onclick="showToast('请联系管理员重置密码','success')">忘记密码？</a>
      </div>

      <button class="btn-login" type="submit" id="loginBtn">登 录</button>

      <div class="login-footer">
        还没有账号？ <a href="#" onclick="showToast('请联系管理员创建账号','success')">注册账号</a>
      </div>
    </form>
  </div>
</div>

<!-- ========================================
   主平台页面
   ======================================== -->
<div class="platform" id="platform">
  <!-- 顶部导航 -->
  <header class="header">
    <div class="header-left">
      <div class="header-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="header-title">计算思维交互式仿真学习平台</span>
    </div>
    <div class="header-right">
      <button class="header-icon-btn" title="应用中心" onclick="showToast('应用中心','success')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <div class="user-dropdown" id="userDropdown">
        <div class="user-avatar" onclick="toggleUserMenu()" id="userAvatar">U</div>
        <div class="user-menu" id="userMenu">
          <div class="user-menu-item" onclick="showToast('个人信息','success')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            个人信息
          </div>
          <div class="user-menu-item" onclick="handleLogout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            退出登录
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 侧边栏 -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-section-title">应用中心</div>
      <ul class="sidebar-menu">
        <li><a href="#" class="active" onclick="showDashboard();return false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          应用中心
        </a></li>
      </ul>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-title">学习模块</div>
      <ul class="sidebar-menu" id="sidebarModules">
      </ul>
    </div>
  </aside>

  <!-- 主内容区 -->
  <main class="main" id="mainContent">
    <div class="main-header">
      <h1 class="main-title">应用中心</h1>
      <p class="main-desc">选择下方模块，进入交互式仿真学习环境。每个模块提供从基础到进阶的完整学习路径。</p>
    </div>
    <div class="module-grid" id="moduleGrid"></div>
  </main>
</div>

<!-- ========================================
   子学习页面容器
   ======================================== -->
<div class="sub-system" id="subSystem">
  <div class="sub-header">
    <button class="sub-back-btn" onclick="closeSubSystem()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15,18 9,12 15,6"/></svg>
    </button>
    <span class="sub-title" id="subSystemTitle">模块名称</span>
  </div>
  <div class="sub-body" id="subSystemBody"></div>
</div>

<!-- ========================================
   JavaScript
   ======================================== -->
<script>
// ==================== 模块数据 ====================
const modules = [
  {
    id:'turing',
    name:'图灵机',
    desc:'探索计算理论的基石，通过可视化模拟理解图灵机的工作原理与停机问题',

// ==================== 渲染模块卡片 ====================
function renderCards() {
  const grid = document.getElementById('moduleGrid');
  grid.innerHTML = modules.map((m,i) => `
    <div class="module-card" style="--card-color:${m.color}" onclick="openSubSystem('${m.id}')">
      <div class="module-card-icon" style="background:${m.color}15;color:${m.color}">
        ${moduleIcon(m.icon)}
      </div>
      <div class="module-card-name">${m.name}</div>
      <div class="module-card-desc">${m.desc}</div>
    </div>
  `).join('');

  // 渲染侧边栏模块菜单
  const sidebar = document.getElementById('sidebarModules');
  sidebar.innerHTML = modules.map(m => `
    <li><a href="#" onclick="openSubSystem('${m.id}');return false" data-module="${m.id}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

// ==================== Toast 通知 ====================
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ==================== 登录处理 ====================
function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!username || !password) {
    showToast('请输入用户名和密码', 'error');
    return false;
  }

  btn.classList.add('loading');
  btn.textContent = '登录中...';

  // 模拟登录
  setTimeout(() => {
    btn.classList.remove('loading');
    btn.textContent = '登 录';

    // 简单验证
    if (password.length >= 1) {
      document.getElementById('loginPage').classList.add('hidden');
      document.getElementById('platform').classList.add('active');
      document.getElementById('userAvatar').textContent = username.charAt(0).toUpperCase();
      showToast('欢迎回来，登录成功！', 'success');
      renderCards();
    } else {
      showToast('密码错误，请重试', 'error');
    }
  }, 800);

  return false;
}

// ==================== 退出登录 ====================
function handleLogout() {
  document.getElementById('userMenu').classList.remove('show');
  document.getElementById('platform').classList.remove('active');
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('loginForm').reset();
  showToast('已安全退出', 'success');
}

// ==================== 用户菜单 ====================
function toggleUserMenu() {
  document.getElementById('userMenu').classList.toggle('show');
}
document.addEventListener('click', (e) => {
  const dd = document.getElementById('userDropdown');
  if (!dd.contains(e.target)) {
    document.getElementById('userMenu').classList.remove('show');
  }
});

// ==================== 返回主面板 ====================
function showDashboard() {
  document.getElementById('subSystem').classList.remove('active');
  document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));
  document.querySelector('.sidebar-menu a[href="#"]').classList.add('active');
}

// ==================== 打开子学习系统 ====================
function openSubSystem(id) {
  const m = modules.find(m => m.id === id);
  if (!m) return;

  // 关闭用户菜单
  document.getElementById('userMenu').classList.remove('show');

  // 渲染子系统页面
  const body = document.getElementById('subSystemBody');
  document.getElementById('subSystemTitle').textContent = m.name;

  body.innerHTML = `
    <div class="sub-welcome">
      <div class="sub-welcome-icon" style="background:${m.color}15;color:${m.color}">
        ${moduleIcon(m.icon)}
      </div>
      <h2>${m.name}</h2>
      <p>${m.content}</p>
      <button class="sub-start-btn" onclick="startSimulation('${m.id}')">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5,3 19,12 5,21"/></svg>
        开始学习
      </button>
    </div>

    <div class="sub-content">
      <div class="sub-content-card">
        <h3>理论基础</h3>
        <p>${m.name}是计算思维体系中的重要组成部分。本模块提供从基础概念到高级应用的完整学习路径，包含视频讲解、交互式演示和课后练习，帮助您系统掌握相关知识。</p>
      </div>
      <div class="sub-content-card">
        <h3>学习目标</h3>
        <p>完成本模块学习后，您将能够：理解${m.name}的核心概念与原理；掌握相关的算法与数据结构；能够运用${m.name}解决实际的计算问题；为进一步学习计算理论奠定坚实基础。</p>
      </div>
    </div>

    <div class="simulator">
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="${m.color}" stroke-width="1.5" opacity=".3">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <polygon points="10,8 16,12 10,16"/>
      </svg>
      <div class="simulator-label">交互式仿真环境 — 点击「开始学习」按钮进入</div>
    </div>
  `;

  document.getElementById('subSystem').classList.add('active');

  // 高亮侧边栏
  document.querySelectorAll('.sidebar-menu a').forEach(a => {
    a.classList.remove('active');
    if (a.dataset.module === id) a.classList.add('active');
  });
}

// ==================== 关闭子学习系统 ====================
function closeSubSystem() {
  document.getElementById('subSystem').classList.remove('active');
  document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));
  document.querySelector('.sidebar-menu a[href="#"]').classList.add('active');
}

// ==================== 开始仿真 ====================
function startSimulation(id) {
  const m = modules.find(m => m.id === id);
  showToast(`${m.name}仿真环境正在启动...`, 'success');
}

// ==================== 键盘快捷键 ====================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeSubSystem();
    document.getElementById('userMenu').classList.remove('show');
  }
  if (e.key === 'Enter' && document.getElementById('loginPage').classList.contains('hidden') === false) {
    document.getElementById('loginForm').requestSubmit();
  }
});

// 页面加载完成
document.addEventListener('DOMContentLoaded', () => {
  console.log('计算思维交互式仿真学习平台已就绪');
});
</script>
